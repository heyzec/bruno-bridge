[project]
name = "bruno-bridge"
version = "1.0.0"
description = "Turn Bruno collections into a programmatic API client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/heyzec/bruno-bridge"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4.1.1,<5",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
reportUnusedCallResult = "none"
